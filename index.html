<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Call Recorder</title>
  </head>
  <body>
    <main class="app">
      <h1>Call Recorder</h1>
      <p class="subtitle">Record your screen + audio — WhatsApp, Zoom, Teams, Google Meet</p>

      <section class="card center-card">
        <ol class="steps" id="steps">
          <li>Click <strong>Start Recording</strong></li>
          <li>Pick your screen or window in the browser dialog</li>
          <li>Check <strong>"Share audio"</strong> before clicking Share</li>
        </ol>

        <div class="btn-row">
          <button id="startBtn">● Start Recording</button>
          <button id="stopBtn" class="btn-danger hidden">■ Stop &amp; Save</button>
        </div>

        <p id="status">Ready</p>
        <p id="timer" class="timer hidden">00:00</p>
      </section>

      <section id="downloadCard" class="card hidden">
        <p id="recordStatus"></p>
        <div class="btn-row">
          <a id="downloadVideo" class="download-btn">⬇ Video + Audio</a>
          <a id="downloadAudio" class="download-btn download-btn-audio">⬇ Audio Only</a>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
